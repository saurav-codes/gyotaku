name: release

# Pushing a tag like v0.1.0 builds every download and publishes them as a
# GitHub release. install.sh and install.ps1 fetch from the latest one, so
# the file names never change between versions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true

env:
  CARGO_TERM_COLOR: always
  ORT_VERSION: 1.28.2
  ORT_WIN_SHA256: c4eedd29489d5feca21866d054638416f3655bf6b18851b3b6b85c8313e95c35
  ORT_MAC_SHA256: c4fceacfc53765d0869dc9180c31ec91054d149017a99d1e80ffe28dc79596de

permissions:
  contents: read

jobs:
  # Built on Ubuntu 22.04, the oldest glibc (2.35) CI tests, so the binaries
  # run there and on everything newer.
  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libfontconfig-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev
      - name: build
        run: cargo build --release --locked
      - name: read a screenshot
        run: |
          ./target/release/gyotaku ocr tests/fixtures/settings.png --threads 2 | tee ocr.txt
          grep -q "cores per screenshot" ocr.txt
      - name: package
        run: |
          name="gyotaku-${{ matrix.arch }}-linux"
          mkdir -p "dist/$name"
          cp target/release/gyotaku target/release/gyotaku-app LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  windows:
    name: windows x86_64
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: build
        run: cargo build --release --locked
      - name: onnx runtime
        run: |
          curl -sSfLo ort.zip "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-win-x64-$ORT_VERSION.zip"
          echo "$ORT_WIN_SHA256  ort.zip" | sha256sum -c -
          unzip -q -j ort.zip "onnxruntime-win-x64-$ORT_VERSION/lib/onnxruntime.dll" -d target/release
      # onnxruntime.dll needs the Visual C++ runtime, which a fresh Windows
      # doesn't have. Microsoft allows shipping these beside the program.
      - name: visual c++ runtime
        run: |
          crt=$(ls -d "/c/Program Files/Microsoft Visual Studio/"*/*/VC/Redist/MSVC/*/x64/Microsoft.VC14*.CRT 2>/dev/null | sort -V | tail -n1)
          echo "from ${crt:-System32}"
          for dll in msvcp140.dll msvcp140_1.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "${crt:-/c/Windows/System32}/$dll" target/release/
          done
      - name: read a screenshot
        run: |
          ./target/release/gyotaku.exe ocr tests/fixtures/settings.png --threads 2 | tee ocr.txt
          grep -q "cores per screenshot" ocr.txt
      - name: package
        run: |
          name="gyotaku-x86_64-windows"
          mkdir -p "dist/$name"
          cp target/release/gyotaku-app.exe target/release/gyotaku.exe target/release/onnxruntime.dll "dist/$name/"
          cp target/release/msvcp140.dll target/release/msvcp140_1.dll target/release/vcruntime140.dll target/release/vcruntime140_1.dll "dist/$name/"
          cp LICENSE "dist/$name/LICENSE.txt"
          cp contrib/windows-readme.txt "dist/$name/README.txt"
          (cd "dist/$name" && 7z a -tzip "../$name.zip" . > /dev/null)
          (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x86_64
          path: dist/*.zip*
          if-no-files-found: error

  # Apple Silicon only: Microsoft publishes no ONNX Runtime build for
  # x86_64 macs, so Intel macs need a build from source with ORT_DYLIB_PATH.
  macos:
    name: macos aarch64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: build
        run: cargo build --release --locked
      # Microsoft's own build, checked against the same hash the app pins.
      - name: onnx runtime
        run: |
          curl -sSfLo ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-osx-arm64-$ORT_VERSION.tgz"
          echo "$ORT_MAC_SHA256  ort.tgz" | shasum -a 256 -c -
          tar -xzf ort.tgz -C target/release --strip-components 2 onnxruntime-osx-arm64-$ORT_VERSION/lib/libonnxruntime.1.28.2.dylib
      - name: read a screenshot
        run: |
          ./target/release/gyotaku ocr tests/fixtures/settings.png --threads 2 | tee ocr.txt
          grep -q "cores per screenshot" ocr.txt
      - name: package
        run: |
          name="gyotaku-aarch64-macos"
          mkdir -p "dist/$name"
          cp target/release/gyotaku target/release/gyotaku-app target/release/libonnxruntime.1.28.2.dylib "dist/$name/"
          cp LICENSE "dist/$name/LICENSE.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-aarch64
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --generate-notes --title "gyotaku $TAG" --repo "$GITHUB_REPOSITORY"
          fi

  # The installers, run against what was just published.
  installers:
    needs: publish
    uses: ./.github/workflows/install.yml
