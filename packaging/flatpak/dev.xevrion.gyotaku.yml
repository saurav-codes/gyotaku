# A draft, not built or submitted yet: see README.md beside it for what
# works inside the sandbox and what still needs code.
app-id: dev.xevrion.gyotaku
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: gyotaku-app

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # The first run downloads ONNX Runtime and the OCR models, once.
  - --share=network
  # Where most screenshot tools save. Read-write, so screenshots can be
  # moved to the trash. Folders anywhere else need an override (README).
  - --filesystem=xdg-pictures

modules:
  # wl-copy, which gyotaku runs to copy images on Wayland. The runtime
  # doesn't ship it.
  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      - -Dzshcompletiondir=no
      - -Dfishcompletiondir=no
    cleanup:
      - /share/man
      - /share/bash-completion
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v2.3.0.tar.gz
        sha256: b4dc560973f0cd74e02f817ffa2fd44ba645a4f1ea94b7b9614dacc9f895f402
        x-checker-data:
          type: anitya
          project-id: 49082
          url-template: https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v$version.tar.gz

  - name: gyotaku
    buildsystem: simple
    build-commands:
      - install -Dm755 gyotaku gyotaku-app -t /app/bin/
      - install -Dm644 share/applications/dev.xevrion.gyotaku.desktop -t /app/share/applications/
      - install -Dm644 share/metainfo/dev.xevrion.gyotaku.metainfo.xml -t /app/share/metainfo/
      - for icon in share/icons/hicolor/*/apps/*; do install -Dm644 "$icon" "/app/$icon"; done
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/xevrion/gyotaku/releases/download/v0.1.3/gyotaku-x86_64-linux.tar.gz
        sha256: FILL-IN-FROM-THE-RELEASE
        x-checker-data:
          type: json
          url: https://api.github.com/repos/xevrion/gyotaku/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "gyotaku-x86_64-linux.tar.gz") | .browser_download_url
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/xevrion/gyotaku/releases/download/v0.1.3/gyotaku-aarch64-linux.tar.gz
        sha256: FILL-IN-FROM-THE-RELEASE
        x-checker-data:
          type: json
          url: https://api.github.com/repos/xevrion/gyotaku/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "gyotaku-aarch64-linux.tar.gz") | .browser_download_url
